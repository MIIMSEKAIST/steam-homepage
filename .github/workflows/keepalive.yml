# Keeps the free-tier Hugging Face Space (steam-backend API) awake so the model pages do not cold-start.
name: keep API awake
on:
  schedule:
    - cron: "17 */12 * * *"
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: ping /api/health
        run: curl -sS --max-time 120 --retry 5 --retry-delay 20 --retry-all-errors https://suenghwan-hwammi.hf.space/api/health

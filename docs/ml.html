<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>모델 카탈로그 — STEAM Project Hub</title>
  <meta name="description" content="이차전지 수명 예측·소재 설계를 위한 머신러닝 모델 9종 카탈로그. 5종은 브라우저에서 바로 실행 가능한 인터랙티브 데모 제공" />
  <meta name="theme-color" content="#f6f8fb" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />
  <link rel="stylesheet" href="assets/steam.css" />
  <script defer src="assets/steam-ui.js"></script>
  <style data-page>
    .toolbar{display:flex; gap:12px; flex-wrap:wrap; align-items:center; margin-top:20px}
    .toolbar .search{flex:1; min-width:220px; max-width:340px}
    .count-line{font-size:13px; color:var(--faint); margin-top:14px}
  </style>
</head>
<body data-nav="models">
  <main class="container">
    <nav class="crumbs" aria-label="breadcrumb">
      <a href="index.html">홈</a><span class="sep">›</span><span class="here">모델</span>
    </nav>

    <section class="page-hero">
      <div class="kicker">Model Catalog</div>
      <h1>머신러닝 모델 카탈로그</h1>
      <p class="lead">
        이차전지 수명 예측과 소재 설계를 위한 머신러닝 모델을 모델 카드 형식으로 제공합니다.
        <strong>인터랙티브 데모</strong> 모델은 별도 설치 없이 브라우저 내에서 직접 추론이 실행됩니다.
      </p>
    </section>

    <div class="toolbar" role="group" aria-label="모델 필터">
      <div class="chips" id="statusChips">
        <button class="chip" data-filter="all" aria-pressed="true">전체 <span class="n">9</span></button>
        <button class="chip" data-filter="demo" aria-pressed="false">인터랙티브 데모 <span class="n">5</span></button>
        <button class="chip" data-filter="soon" aria-pressed="false">공개 예정 <span class="n">4</span></button>
      </div>
      <input class="search" id="searchBox" type="text" placeholder="모델 검색 (예: 수명, SEM, EIS…)" aria-label="모델 검색" />
    </div>
    <p class="count-line" id="countLine"></p>

    <section class="model-grid" id="modelGrid" aria-label="모델 목록"></section>
  </main>

  <script>
    const MODELS = [
      {
        id:'bo', href:'model-bo.html', status:'demo', badge:'external', badgeLabel:'DEMO',
        title:'Bayesian Optimization 기반 NCM811 합성 조건 추천',
        desc:'문헌·실험 데이터로 학습한 Random Forest surrogate가 사용자가 지정한 합성 조건 탐색 범위에서 예측 방전 용량 상위 3개 조건을 제안합니다.',
        tags:['설계 최적화','RF Surrogate','Hugging Face Space']
      },
      {
        id:'temp-life', href:'model-temp-life.html', status:'demo', badge:'live', badgeLabel:'LIVE',
        title:'온도 변수 사이클 수명 시험 모델',
        desc:'방전 전류·전압·주변 온도를 입력하면 물리 기반 폐쇄형 수식과 파라미터 불확실성(±1σ)으로 사이클별 용량 궤적과 EOL 도달 시점을 예측합니다.',
        tags:['수명 예측','물리 기반 + MC','브라우저 내 계산']
      },
      {
        id:'curr-life', href:'model-curr-life.html', status:'demo', badge:'live', badgeLabel:'LIVE',
        title:'전류 변수 사이클 수명 예측 모델',
        desc:'충·방전 프로토콜(C1, %, C2)을 입력하면 LightGBM 4종이 특성 시퀀스를 생성하고 CNN-LSTM이 수명 곡선을 롤아웃 예측합니다.',
        tags:['수명 예측','CNN-LSTM + LGBM','ONNX Runtime Web']
      },
      {
        id:'soc-cycle', href:'model-soc-cycle.html', status:'demo', badge:'live', badgeLabel:'LIVE',
        title:'충전도 기반 사이클 수명 시험 모델',
        desc:'상구간 V–Q 곡선 32점과 dQ/dV 피크(자동 추출)로부터 하구간 용량 곡선을 예측해 전체 방전 곡선을 복원합니다.',
        tags:['수명 예측','V–Q 곡선 복원','ONNX Runtime Web']
      },
      {
        id:'shelf', href:'model-shelf.html', status:'demo', badge:'live', badgeLabel:'LIVE',
        title:'충전도 기반 보관 수명 특성 예측 모델',
        desc:'초기 용량과 경과 시간별 측정값을 입력하면 이후 보관 구간의 용량·보존율을 재귀 롤아웃으로 예측하고 CSV로 내보냅니다.',
        tags:['수명 예측','시계열 롤아웃','ONNX Runtime Web']
      },
      {
        id:'sem-img', status:'soon', badge:'soon', badgeLabel:'COMING SOON',
        title:'SEM 이미지 기반 양극재 열화 상태 예측·정량화 모델',
        desc:'SEM 이미지로부터 양극재 열화 지표를 추정하고 정량화하는 컴퓨터 비전 모델. 웹 데모 준비 중입니다.',
        tags:['이미지 분석','SEM','준비 중']
      },
      {
        id:'tem-img', status:'soon', badge:'soon', badgeLabel:'COMING SOON',
        title:'TEM 이미지 기반 양극 열화 상태 예측 모델',
        desc:'TEM 이미지로 양극의 구조적 열화 상태를 분류·회귀하는 모델. 웹 데모 준비 중입니다.',
        tags:['이미지 분석','TEM','준비 중']
      },
      {
        id:'eis-predict', status:'soon', badge:'soon', badgeLabel:'COMING SOON',
        title:'EIS 평가 기반 배터리 성능 변화 조기예측 모델',
        desc:'EIS 스펙트럼으로부터 향후 성능 저하·잔여 수명을 조기 예측하는 모델. 웹 데모 준비 중입니다.',
        tags:['임피던스','EIS','준비 중']
      },
      {
        id:'llmmd-video', status:'soon', badge:'soon', badgeLabel:'COMING SOON',
        title:'LLM 기반 MD 시뮬레이션 전해질 물성 자동 예측',
        desc:'LLM을 결합한 MD 시뮬레이션 워크플로우로 전해질 물성 예측 과정을 자동화합니다. 데모 영상 공개 예정입니다.',
        tags:['시뮬레이션 자동화','LLM + MD','준비 중']
      }
    ];

    const grid = document.getElementById('modelGrid');
    const countLine = document.getElementById('countLine');
    const searchBox = document.getElementById('searchBox');
    let statusFilter = 'all';

    function cardHTML(m){
      const tags = m.tags.map((t,i)=> `<span class="tag${i===0?' teal':''}">${t}</span>`).join('');
      const inner = `
        <div class="top">
          <h3>${m.title}</h3>
          <span class="badge ${m.badge}">${m.badgeLabel}</span>
        </div>
        <p class="desc">${m.desc}</p>
        <div class="tags">${tags}</div>
        ${m.href ? '<span class="cta">데모 실행 →</span>' : '<span class="cta" style="color:var(--faint)">공개 예정</span>'}`;
      return m.href
        ? `<a class="model-card" href="${m.href}">${inner}</a>`
        : `<div class="model-card soon">${inner}</div>`;
    }

    function render(){
      const q = (searchBox.value || '').trim().toLowerCase();
      const list = MODELS.filter(m=>{
        if(statusFilter !== 'all' && m.status !== statusFilter) return false;
        if(q){
          const hay = (m.title + ' ' + m.desc + ' ' + m.tags.join(' ')).toLowerCase();
          if(!hay.includes(q)) return false;
        }
        return true;
      });
      grid.innerHTML = list.map(cardHTML).join('') ||
        '<p class="muted" style="grid-column:1/-1">조건에 맞는 모델이 없습니다.</p>';
      countLine.textContent = `총 ${MODELS.length}종 중 ${list.length}종 표시`;
    }

    document.querySelectorAll('#statusChips .chip').forEach(chip=>{
      chip.addEventListener('click', ()=>{
        document.querySelectorAll('#statusChips .chip').forEach(c=> c.setAttribute('aria-pressed','false'));
        chip.setAttribute('aria-pressed','true');
        statusFilter = chip.dataset.filter;
        render();
      });
    });
    searchBox.addEventListener('input', render);
    render();
  </script>
</body>
</html>

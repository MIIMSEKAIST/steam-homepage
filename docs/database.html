<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>데이터베이스 — STEAM Project Hub</title>
  <meta name="description" content="이차전지 실험(AFM·SEM·TEM·XRD·EIS 등), 계산/시뮬레이션, 문헌 추출 데이터셋 16종 카탈로그" />
  <meta name="theme-color" content="#f6f8fb" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />
  <link rel="stylesheet" href="assets/steam.css" />
  <script defer src="assets/steam-ui.js"></script>
  <style data-page>
    .toolbar{display:flex; gap:12px; flex-wrap:wrap; align-items:center; margin-top:20px}
    .toolbar .search{flex:1; min-width:220px; max-width:340px}
    .count-line{font-size:13px; color:var(--faint); margin:14px 0 10px}
    .ds-name{font-weight:700; letter-spacing:-.01em}
    .ds-sub{font-size:12px; color:var(--faint); margin-top:1px}
    .ds-desc{color:var(--muted); max-width:46ch}
    @media (max-width:760px){ .hide-sm{display:none} }
    td.ds-actions{text-align:right; white-space:nowrap}
  </style>
</head>
<body data-nav="db">
  <main class="container">
    <nav class="crumbs" aria-label="breadcrumb">
      <a href="index.html">홈</a><span class="sep">›</span><span class="here">데이터베이스</span>
    </nav>

    <section class="page-hero">
      <div class="kicker">Database</div>
      <h1>이차전지 데이터셋 카탈로그</h1>
      <p class="lead">
        상용 리튬이차전지 용량·수명 관련 데이터를 <strong>실험</strong>, <strong>계산/시뮬레이션</strong>,
        <strong>문헌 추출</strong> 세 가지 출처로 분류해 제공합니다. 각 데이터셋은 저장소 링크를 통해 접근할 수 있습니다.
      </p>
    </section>

    <section class="stats-row" aria-label="데이터 현황">
      <div class="stat-card"><div class="k">전체 데이터셋</div><div class="v">16<small>건</small></div></div>
      <div class="stat-card"><div class="k">실험 데이터</div><div class="v">10<small>건</small></div></div>
      <div class="stat-card"><div class="k">계산·시뮬레이션</div><div class="v">3<small>건</small></div></div>
      <div class="stat-card"><div class="k">문헌 추출</div><div class="v">3<small>건</small></div></div>
    </section>

    <div class="toolbar" role="group" aria-label="데이터셋 필터">
      <div class="chips" id="srcChips">
        <button class="chip" data-filter="all" aria-pressed="true">전체 <span class="n">16</span></button>
        <button class="chip" data-filter="experimental" aria-pressed="false">실험 <span class="n">10</span></button>
        <button class="chip" data-filter="simulation" aria-pressed="false">계산·시뮬레이션 <span class="n">3</span></button>
        <button class="chip" data-filter="literature" aria-pressed="false">문헌 추출 <span class="n">3</span></button>
      </div>
      <input class="search" id="searchBox" type="text" placeholder="데이터셋 검색 (예: SEM, 전해질…)" aria-label="데이터셋 검색" />
    </div>
    <p class="count-line" id="countLine"></p>

    <div style="overflow-x:auto">
      <table id="dsTable" aria-label="데이터셋 목록">
        <thead>
          <tr>
            <th>데이터셋</th>
            <th style="width:130px">분류</th>
            <th class="hide-sm">설명</th>
            <th style="width:110px; text-align:right">저장소</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>
  </main>

  <script>
    const SRC_LABEL = {
      experimental:{ label:'실험', cls:'teal' },
      simulation:{ label:'계산·시뮬레이션', cls:'' },
      literature:{ label:'문헌 추출', cls:'' }
    };

    const DATASETS = [
      { src:'experimental', name:'AFM', sub:'Atomic Force Microscopy',
        desc:'원자간력현미경 기반 표면 형상·물성 측정 데이터',
        url:'https://drive.google.com/drive/folders/1WKQiTB24VrLCixWQ96-MAoypvfAMcOFo?usp=drive_link' },
      { src:'experimental', name:'TEM', sub:'Transmission Electron Microscopy',
        desc:'투과전자현미경 기반 미세구조 관찰 데이터',
        url:'https://drive.google.com/drive/folders/1wScweViUADfc5OPtunWVfqPu0xCe81Pn?usp=sharing' },
      { src:'experimental', name:'SEM', sub:'Scanning Electron Microscopy',
        desc:'주사전자현미경 기반 형상·단면 이미지 데이터',
        url:'https://drive.google.com/drive/folders/1HcoX_HU1GujgvnucEgbhgURxjdt6xw_B?usp=sharing' },
      { src:'experimental', name:'Cycling Data', sub:'Charge/Discharge Logs',
        desc:'충·방전 사이클 로그 (용량·전압·전류 시계열)',
        url:'https://drive.google.com/drive/folders/1mP7aTJo44pzO6UO6kdCU65MU2aNqXpSR?usp=sharing' },
      { src:'experimental', name:'XPS', sub:'X-ray Photoelectron Spectroscopy',
        desc:'X선 광전자분광 기반 표면 화학 상태 분석 데이터',
        url:'https://drive.google.com/drive/folders/1izmgyFcHjE6W-JqJoNG389mK0MmbaykJ?usp=sharing' },
      { src:'experimental', name:'XRD', sub:'X-ray Diffraction',
        desc:'X선 회절 기반 결정 구조 분석 데이터',
        url:'https://drive.google.com/drive/folders/1-rDnU4c-pRjMm5MCXMfJIClG0UrZsHv8?usp=sharing' },
      { src:'experimental', name:'STXM', sub:'Scanning Transmission X-ray Microscopy',
        desc:'주사투과 X선 현미경 기반 화학 상태 이미징 데이터',
        url:'https://drive.google.com/drive/folders/1gBD3O78T-gHD4KNmuljqws6rpIU9ASud?usp=sharing' },
      { src:'experimental', name:'PXM', sub:'Projection X-ray Microscopy',
        desc:'투영 X선 현미경 기반 내부 구조 이미징 데이터',
        url:'https://drive.google.com/drive/folders/1Rnz3ExHJmn7PC_OhS6amsXKJ61spTk7g?usp=sharing' },
      { src:'experimental', name:'FIB-SEM Tomography', sub:'Focused Ion Beam-SEM',
        desc:'집속이온빔-SEM 기반 3차원 단층 재구성 데이터',
        url:'https://drive.google.com/drive/folders/1HtuzOjGZyo6HV3mTfm-mPWS3FvXWkfp8?usp=sharing' },
      { src:'experimental', name:'EIS', sub:'Electrochemical Impedance Spectroscopy',
        desc:'전기화학 임피던스 분광 스펙트럼 데이터',
        url:'https://drive.google.com/drive/folders/1z8-RPwRgESjg-iPrTAKisErhGzkXUHDh?usp=sharing' },
      { src:'simulation', name:'Phase-field 계산 데이터', sub:'상-장 이론 기반',
        desc:'다중 입자·전극 단위 시뮬레이션 구축 및 파라미터 분석 결과',
        url:'https://drive.google.com/drive/folders/1Co4hWMOb1Eum2eBYuwT46GLPZWacrMDR?usp=sharing' },
      { src:'simulation', name:'액체 전해질 물성 계산 데이터', sub:'분자 시뮬레이션',
        desc:'액체 전해질 물성 계산 결과 모음',
        url:'https://drive.google.com/drive/folders/10vit-xaO8JVXqUyMwkwqQDLQfoFNhl9-?usp=sharing' },
      { src:'simulation', name:'양극재 물성 계산 데이터', sub:'제일원리·원자단위 계산',
        desc:'양극재 결정/형성 관련 물성 계산 결과 모음',
        url:'https://drive.google.com/drive/folders/14u4C8kuMVfME9xUMpyZpV-Ym-BSo94RU?usp=sharing' },
      { src:'literature', name:'AI 기반 전극소재 개발 기술 DB', sub:'문헌 추출·정규화',
        desc:'문헌에서 추출·정규화한 전극 조성/공정/성능 항목을 AI 학습 가능 형태로 구성',
        url:'https://drive.google.com/drive/folders/1f9oYaVrx_H0GcAjDDuni3kUHnTM9XWIC?usp=sharing' },
      { src:'literature', name:'온도 변수 용량 예측 모델용 DB', sub:'문헌 추출·정규화',
        desc:'온도 조건별 방전 용량·열화 지표를 표준 스키마로 정리',
        url:'https://drive.google.com/drive/folders/1AmQhQZh_AKQH2at4n_yoYFY46pQ0j8am?usp=sharing' },
      { src:'literature', name:'전류 변수 용량 예측 모델용 DB', sub:'문헌 추출·정규화',
        desc:'레이트/전류 프로토콜에 따른 용량·수명 데이터를 체계적으로 수집',
        url:'https://drive.google.com/drive/folders/1B6J7wCaiTRAQdQ-IetJMOPYuLyPlsyL-?usp=sharing' }
    ];

    const tbody = document.querySelector('#dsTable tbody');
    const countLine = document.getElementById('countLine');
    const searchBox = document.getElementById('searchBox');
    let srcFilter = 'all';

    function render(){
      const q = (searchBox.value || '').trim().toLowerCase();
      const list = DATASETS.filter(d=>{
        if(srcFilter !== 'all' && d.src !== srcFilter) return false;
        if(q){
          const hay = (d.name + ' ' + d.sub + ' ' + d.desc).toLowerCase();
          if(!hay.includes(q)) return false;
        }
        return true;
      });
      tbody.innerHTML = list.map(d=>{
        const s = SRC_LABEL[d.src];
        return `<tr>
          <td><div class="ds-name">${d.name}</div><div class="ds-sub">${d.sub}</div></td>
          <td><span class="tag ${s.cls}">${s.label}</span></td>
          <td class="hide-sm"><div class="ds-desc">${d.desc}</div></td>
          <td class="ds-actions"><a class="btn sm" href="${d.url}" target="_blank" rel="noopener">열기 ↗</a></td>
        </tr>`;
      }).join('') || '<tr><td colspan="4" class="muted">조건에 맞는 데이터셋이 없습니다.</td></tr>';
      countLine.textContent = `총 ${DATASETS.length}건 중 ${list.length}건 표시 · 저장소 링크는 새 탭에서 열립니다.`;
    }

    function setFilter(f){
      srcFilter = f;
      document.querySelectorAll('#srcChips .chip').forEach(c=>
        c.setAttribute('aria-pressed', String(c.dataset.filter === f)));
      render();
    }
    document.querySelectorAll('#srcChips .chip').forEach(chip=>
      chip.addEventListener('click', ()=> setFilter(chip.dataset.filter)));
    searchBox.addEventListener('input', render);

    // 구 페이지(experiments/simulations/literature)에서 넘어온 경우 필터 선반영
    const src = new URLSearchParams(location.search).get('src');
    setFilter(['experimental','simulation','literature'].includes(src) ? src : 'all');
  </script>
</body>
</html>
